name: Diagnose one actual native grammar failure
on:
  workflow_dispatch:
  push:
    branches: [codex/pdf-local-recovery]
    paths: ['.github/workflows/native-grammar-error-probe.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      ORT_TELEMETRY_DISABLED: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gate public source tree and GitHub noreply identities
        shell: pwsh
        run: python scripts/check-public-tree.py
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Replay one unchanged request with bounded native error evidence
        shell: pwsh
        run: dotnet run --project tools/label-selection-model-probe/WindowsLabelSelectionProbe.csproj --configuration Release --no-launch-profile -- --first-case 'qwen3.5-2b-text-generic-cpu:1'
