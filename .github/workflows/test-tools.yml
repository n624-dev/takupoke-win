name: Test tools and catalogue

on:
  push:
    branches: [codex/windows-change-row-skips-20261009]
    paths:
      - .github/workflows/test-tools.yml
      - scripts/test_catalog*.py
      - tests/test_test_catalog.py
      - tests/test-catalog.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    name: Catalogue and packaging contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B scripts/check-public-tree.py
      - run: python3 -B scripts/test_catalog.py check
      - run: python3 -B tests/test_test_catalog.py
      - run: python3 -B tests/package-notices-tests.py
      - run: git diff-tree --check HEAD
