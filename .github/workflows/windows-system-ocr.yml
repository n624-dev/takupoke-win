name: Compare installed Windows system OCR on fictional original lines
on:
  workflow_dispatch:
    inputs:
      install_japanese:
        description: Install the official Japanese OCR capability before measurement
        type: boolean
        default: false
  push:
    branches: [codex/windows-local-ai-improvement-20261013]
    paths:
      - '.github/workflows/windows-system-ocr.yml'
      - 'tools/windows-system-ocr/**'
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure owned paths
        run: |
          $taskRoot = Join-Path $env:RUNNER_TEMP "takupoke-system-ocr-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          @("TAKUPOKE_SYSTEM_OCR_TEMP=$taskRoot", "DOTNET_CLI_HOME=$(Join-Path $taskRoot 'dotnet')", "NUGET_PACKAGES=$(Join-Path $taskRoot 'nuget')") | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
          cache: false
      - run: python scripts/check-public-tree.py
      - name: Record installed OCR language capabilities
        run: |
          Get-WindowsCapability -Online | Where-Object { $_.Name -like 'Language.OCR*' } | Select-Object Name, State | ConvertTo-Json -Compress
      - name: Install public Japanese OCR language capability before inference
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.install_japanese }}
        timeout-minutes: 8
        run: |
          $capability = 'Language.OCR~~~ja-JP~0.0.1.0'
          $before = Get-WindowsCapability -Online -Name $capability
          $before | Select-Object Name, State | ConvertTo-Json -Compress
          if ($before.State -ne 'Installed') { Add-WindowsCapability -Online -Name $capability | ConvertTo-Json -Compress }
          $after = Get-WindowsCapability -Online -Name $capability
          $after | Select-Object Name, State | ConvertTo-Json -Compress
          if ($after.State -ne 'Installed') { throw 'Japanese OCR capability not installed; no Japanese precision measurement.' }
      - name: Measure installed local OCR engines
        run: |
          python -B tools/windows-system-ocr/run.py --output (Join-Path $env:TAKUPOKE_SYSTEM_OCR_TEMP 'study')
          if ($LASTEXITCODE -ne 0) { throw 'System OCR unavailable or failed; missing precision remains unassessed.' }
      - name: Remove owned fictional output and package files
        if: always()
        run: |
          $expected = Join-Path $env:RUNNER_TEMP "takupoke-system-ocr-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($env:TAKUPOKE_SYSTEM_OCR_TEMP -and [IO.Path]::GetFullPath($env:TAKUPOKE_SYSTEM_OCR_TEMP) -ne [IO.Path]::GetFullPath($expected)) { throw 'Unexpected cleanup path.' }
          dotnet build-server shutdown
          if (Test-Path -LiteralPath $expected) { Remove-Item -LiteralPath $expected -Recurse -Force }
          if (Test-Path -LiteralPath $expected) { throw 'Owned output remains.' }
