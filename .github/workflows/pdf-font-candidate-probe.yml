name: Bounded local font metadata candidates
on:
  push:
    branches: [research/windows-ordered-raster-observation-20261007]
    paths:
      - tools/pdf-font-candidate-probe/**
      - .github/workflows/pdf-font-candidate-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: ''
      - name: Install bounded research parser dependencies
        run: python -m pip install --no-cache-dir --disable-pip-version-check fonttools==4.61.1 PyMuPDF==1.26.6
      - name: Verify invented mapping and refusal controls
        working-directory: tools/pdf-font-candidate-probe
        run: python -B -m unittest -v
      - name: Observe missing-map independent PDFs in memory
        working-directory: tools/pdf-font-candidate-probe
        run: python -B probe_pdf.py
