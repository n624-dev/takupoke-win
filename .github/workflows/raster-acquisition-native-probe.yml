name: Measure actual fictional raster PDF acquisition
on:
  push:
    branches: ['codex/pdf-local-recovery']
    paths:
      - '.github/workflows/raster-acquisition-native-probe.yml'
      - 'tools/raster-acquisition-native-probe/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      ORT_TELEMETRY_DISABLED: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gate public source and noreply identities
        shell: pwsh
        run: python scripts/check-public-tree.py
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Assemble fixed lossless image-only fictional PDFs
        shell: pwsh
        run: python tools/raster-acquisition-native-probe/fixtures/assemble.py
      - name: Run actual Windows PDF and OCR acquisition with a literal full oracle
        shell: pwsh
        run: dotnet run --project tools/raster-acquisition-native-probe/WindowsRasterNativeProbe.csproj --configuration Release --no-launch-profile
