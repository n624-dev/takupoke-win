name: Measure actual fictional raster PDF acquisition
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Raw tensor diagnostics or unchanged full acquisition baseline'
        type: choice
        default: tensor-diagnostics
        options: [tensor-diagnostics, baseline]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      ORT_TELEMETRY_DISABLED: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gate public source and noreply identities
        shell: pwsh
        run: python scripts/check-public-tree.py
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Assemble fixed lossless image-only fictional PDFs
        shell: pwsh
        run: python tools/raster-acquisition-native-probe/fixtures/assemble.py
      - name: Record runner-visible hardware
        shell: pwsh
        run: |
          $cpu = @(Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors)
          $system = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          @{ sourceCommit = $env:GITHUB_SHA; processors = $cpu; allocatedPhysicalMemoryBytes = [Int64]$system.TotalPhysicalMemory; architecture = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString(); os = $os.Caption; osVersion = $os.Version; osBuild = $os.BuildNumber } | ConvertTo-Json -Depth 5
      - name: Run fixed native OCR evidence mode
        shell: pwsh
        env:
          EVIDENCE_MODE: ${{ inputs.mode }}
        run: |
          if ($env:EVIDENCE_MODE -eq 'baseline') {
            dotnet run --project tools/raster-acquisition-native-probe/WindowsRasterNativeProbe.csproj --configuration Release --no-launch-profile
          } else {
            dotnet run --project tools/raster-acquisition-native-probe/WindowsRasterNativeProbe.csproj --configuration Release --no-launch-profile -- --tensor-diagnostics
          }
