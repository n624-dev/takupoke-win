name: Fictional localized image cell research
on:
  push:
    branches: [research/localized-image-cell-20261006]
  workflow_dispatch:
    inputs:
      approved_packet_sha256:
        description: Exact root-reviewed source packet SHA256
        required: true
        type: string
      approved_recipe_sha256:
        description: Exact root-reviewed two-call image recipe SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: fictional-localized-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    if: github.repository == 'n624-dev/takupoke-win' && github.ref == 'refs/heads/research/localized-image-cell-20261006' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/localized-image-cell-research/
            /.github/workflows/localized-image-cell-research.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Register and validate without downloads or inference
        if: github.event_name == 'push'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python tools/localized-image-cell-research/bootstrap_ci.py --validate-only
          python -m unittest discover -s tools/localized-image-cell-research -p 'test_*.py' -v
      - name: Exact approved two-call localized image comparison
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_PACKET_SHA: ${{ inputs.approved_packet_sha256 }}
          APPROVED_RECIPE_SHA: ${{ inputs.approved_recipe_sha256 }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python tools/localized-image-cell-research/bootstrap_ci.py --packet-sha "$APPROVED_PACKET_SHA" --recipe-sha "$APPROVED_RECIPE_SHA"
      - name: Always remove owned research scratch
        if: always()
        run: python tools/localized-image-cell-research/bootstrap_ci.py --cleanup-only
