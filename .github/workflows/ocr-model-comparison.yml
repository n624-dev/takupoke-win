name: Compare same-pixel OCR models and CTC decoding on Windows
on:
  push:
    branches: [codex/windows-local-ai-improvement-20261013]
    paths:
      - '.github/workflows/ocr-model-comparison.yml'
      - 'tools/ocr-model-comparison/Program.cs'
      - 'tools/ocr-model-comparison/Probe.csproj'
      - 'tools/ocr-model-comparison/run.py'
      - 'tools/ocr-model-comparison/run_frozen.py'
      - 'tools/vision-ocr-comparison/fictional-pixels.json'
      - 'src/Takupoke.Infrastructure/Recovery/OcrCtcDecoder.cs'
      - 'src/Takupoke.Infrastructure/Recovery/OnnxJapaneseOcr.cs'
      - 'src/Takupoke.Infrastructure/Recovery/OcrInputTransform.cs'
      - 'tests/Takupoke.Integration.Tests/OcrCtcDecoderTests.cs'
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
      ORT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use job-owned model, font and package paths
        run: |
          $taskRoot = Join-Path $env:RUNNER_TEMP "takupoke-ocr-comparison-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          @(
            "TAKUPOKE_OCR_TEMP=$taskRoot"
            "DOTNET_CLI_HOME=$(Join-Path $taskRoot 'dotnet-home')"
            "NUGET_PACKAGES=$(Join-Path $taskRoot 'nuget')"
            "NUGET_HTTP_CACHE_PATH=$(Join-Path $taskRoot 'nuget-http')"
            "PIP_CACHE_DIR=$(Join-Path $taskRoot 'pip-cache')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
          cache: false
      - run: python scripts/check-public-tree.py
      - run: python -m pip install --disable-pip-version-check -r tools/ocr-model-comparison/requirements.txt
      - run: python -B -m unittest discover -s tools/ocr-model-comparison -p 'test_*.py'
      - name: Check production decoder regressions
        run: dotnet test tests/Takupoke.Integration.Tests/Takupoke.Integration.Tests.csproj -c Release --filter FullyQualifiedName~OcrCtcDecoderTests --verbosity quiet
      - name: Compare fixed models, pixels and decoder outputs
        run: |
          $owned = Join-Path $env:TAKUPOKE_OCR_TEMP 'measurement'
          python -B tools/ocr-model-comparison/run_frozen.py --output $owned --cleanup
          if ($LASTEXITCODE -ne 0) { throw 'OCR comparison failed; missing calls remain unassessed.' }
      - name: Remove all owned models, fonts and caches
        if: always()
        run: |
          $expected = Join-Path $env:RUNNER_TEMP "takupoke-ocr-comparison-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($env:TAKUPOKE_OCR_TEMP -and [IO.Path]::GetFullPath($env:TAKUPOKE_OCR_TEMP) -ne [IO.Path]::GetFullPath($expected)) { throw 'Unexpected cleanup path.' }
          if (Get-Command dotnet -ErrorAction SilentlyContinue) { dotnet build-server shutdown }
          if (Test-Path -LiteralPath $expected) { Remove-Item -LiteralPath $expected -Recurse -Force }
          if (Test-Path -LiteralPath $expected) { throw 'Owned temporary files remain.' }
          Write-Output 'Owned models, fonts and caches removed. No Actions artifacts or caches uploaded.'
