name: Verify complete source-colour recovery on Windows
on:
  push:
    branches: [codex/windows-local-ai-improvement-20261013]
    paths:
      - '.github/workflows/pdf-colour-acquisition.yml'
      - 'tools/pdf-colour-acquisition/**'
      - 'src/Takupoke.Infrastructure/Parsing/PdfPigLayoutReader.cs'
      - 'src/Takupoke.Infrastructure/Parsing/PdfScheduleParser.cs'
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use owned source and package paths
        run: |
          $root = Join-Path $env:RUNNER_TEMP "takupoke-pdf-colour-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          @(
            "TAKUPOKE_COLOUR_TEMP=$root"
            "DOTNET_CLI_HOME=$(Join-Path $root 'dotnet')"
            "NUGET_PACKAGES=$(Join-Path $root 'nuget')"
            "NUGET_HTTP_CACHE_PATH=$(Join-Path $root 'nuget-http')"
            "PIP_CACHE_DIR=$(Join-Path $root 'pip')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
          cache: false
      - run: python scripts/check-public-tree.py
      - run: python -m pip install --disable-pip-version-check -r tools/independent-wide-timetable/requirements.txt
      - name: Freeze identical source inputs and build both readers
        run: |
          $fixtures = Join-Path $env:TAKUPOKE_COLOUR_TEMP 'fixtures'
          $baseline = Join-Path $env:TAKUPOKE_COLOUR_TEMP 'baseline'
          git worktree add --detach $baseline f040bb641687aaa5462b37ed0ee6c21591165eec
          if ($LASTEXITCODE -ne 0) { throw 'Pinned baseline checkout failed.' }
          python -B tools/pdf-colour-acquisition/generate.py --output $fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Source fixture generation failed.' }
          dotnet build (Join-Path $baseline 'tools/ordered-row-e2e/Probe.csproj') -c Release --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed.' }
          dotnet build tools/ordered-row-e2e/Probe.csproj -c Release --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed.' }
      - name: Compare complete native source results
        run: |
          $fixtures = Join-Path $env:TAKUPOKE_COLOUR_TEMP 'fixtures'
          $before = Join-Path $env:TAKUPOKE_COLOUR_TEMP 'baseline-report.json'
          $after = Join-Path $env:TAKUPOKE_COLOUR_TEMP 'candidate-report.json'
          $dll = Join-Path $env:TAKUPOKE_COLOUR_TEMP 'baseline/tools/ordered-row-e2e/bin/Release/net10.0/Probe.dll'
          python -B tools/pdf-colour-acquisition/run.py --fixtures $fixtures --dll $dll --output $before
          if ($LASTEXITCODE -ne 0) { throw 'Baseline source comparison failed.' }
          python -B tools/pdf-colour-acquisition/run.py --fixtures $fixtures --dll tools/ordered-row-e2e/bin/Release/net10.0/Probe.dll --output $after
          if ($LASTEXITCODE -ne 0) { throw 'Candidate source comparison failed.' }
          python -B tools/pdf-colour-acquisition/compare.py --baseline $before --candidate $after
          if ($LASTEXITCODE -ne 0) { throw 'Complete source/negative contract failed.' }
      - name: Remove all owned sources, fonts and packages
        if: always()
        run: |
          $expected = Join-Path $env:RUNNER_TEMP "takupoke-pdf-colour-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($env:TAKUPOKE_COLOUR_TEMP -and [IO.Path]::GetFullPath($env:TAKUPOKE_COLOUR_TEMP) -ne [IO.Path]::GetFullPath($expected)) { throw 'Unexpected cleanup path.' }
          if (Get-Command dotnet -ErrorAction SilentlyContinue) { dotnet build-server shutdown }
          $baseline = Join-Path $expected 'baseline'
          if (Test-Path -LiteralPath $baseline) {
            git worktree remove --force $baseline
            if ($LASTEXITCODE -ne 0) { throw 'Owned baseline worktree remains.' }
          }
          if (Test-Path -LiteralPath $expected) { Remove-Item -LiteralPath $expected -Recurse -Force }
          if (Test-Path -LiteralPath $expected) { throw 'Owned temporary files remain.' }
          Write-Output 'Owned sources/fonts/packages removed; no Actions artifacts or caches.'
