name: Diagnose native local format routing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: ['qwen2.5-1.5b-instruct-generic-cpu:4', 'qwen3.5-2b-text-generic-cpu:1']
    env:
      ORT_TELEMETRY_DISABLED: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gate public source tree and GitHub noreply identities
        shell: pwsh
        run: python scripts/check-public-tree.py
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Diagnose JSON-schema and Lark routing with unrelated literal controls
        shell: pwsh
        run: dotnet run --project tools/label-selection-model-probe/WindowsLabelSelectionProbe.csproj --configuration Release --no-launch-profile -- --format-routing '${{ matrix.model }}'
