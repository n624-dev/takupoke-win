name: Validate original OCR row ordering on fresh native Windows PDFs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      ORT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Check public source and record machine
        run: |
          python scripts/check-public-tree.py
          $studyRoot = Join-Path $env:RUNNER_TEMP "takupoke-ocr-source-order-accuracy-$env:GITHUB_RUN_ID"
          "TAKUPOKE_PRODUCTION_TEMP=$studyRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path $studyRoot | Out-Null
          @{ processors = @(Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors); physicalMemoryBytes = [long](Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory; sourceCommit = $env:GITHUB_SHA } | ConvertTo-Json -Depth 5 | Out-File (Join-Path $studyRoot 'hardware.json') -Encoding utf8
      - run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Execute frozen paired whole-document comparison
        run: |
          python tools/ocr-source-order-accuracy/run_windows.py --output (Join-Path $env:TAKUPOKE_PRODUCTION_TEMP 'run')
          if ($LASTEXITCODE -ne 0) { throw 'Native production validation failed. Preserve raw observations and failure.' }
      - name: Collect closed fictional records and source snapshots
        if: always()
        run: |
          python tools/ocr-whole-model-comparison/collect.py --run (Join-Path $env:TAKUPOKE_PRODUCTION_TEMP 'run') --output (Join-Path $env:TAKUPOKE_PRODUCTION_TEMP 'records')
          Copy-Item (Join-Path $env:TAKUPOKE_PRODUCTION_TEMP 'hardware.json') (Join-Path $env:TAKUPOKE_PRODUCTION_TEMP 'records')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-order-native-fresh-records
          path: ${{ env.TAKUPOKE_PRODUCTION_TEMP }}/records
          retention-days: 7
      - name: Remove owned models and fictional sources
        if: always()
        run: |
          $expected = Join-Path $env:RUNNER_TEMP "takupoke-ocr-source-order-accuracy-$env:GITHUB_RUN_ID"
          if ($env:TAKUPOKE_PRODUCTION_TEMP -ne $expected) { throw 'Unexpected cleanup path.' }
          if (Test-Path $expected) { Remove-Item -LiteralPath $expected -Recurse -Force }
