name: Blind isolated header recognition comparison
on:
  push:
    branches: [research/windows-ordered-raster-observation-20261007]
    paths:
      - tools/header-reader-probe/**
      - tools/ordered-row-e2e/compare_header_pairs.py
      - .github/workflows/header-recognition-comparison.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      ORT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
          cache: false
      - run: python -m pip install --no-cache-dir --disable-pip-version-check -r tools/independent-wide-timetable/requirements.txt
      - name: Pin model and compile native recognizer in owned scratch
        shell: pwsh
        run: |
          $owned = Join-Path $env:RUNNER_TEMP 'isolated-header-reader-owned'
          New-Item -ItemType Directory -Path $owned -ErrorAction Stop | Out-Null
          $model = Join-Path $owned 'english-rec.onnx'
          Invoke-WebRequest -Uri 'https://huggingface.co/SWHL/RapidOCR/resolve/1cfba2e90fc938db55889873735088de210cc173/PP-OCRv3/en_PP-OCRv3_rec_infer.onnx' -OutFile $model -TimeoutSec 180
          if ((Get-Item $model).Length -ne 8967018 -or (Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ef7abd8bd3629ae57ea2c28b425c1bd258a871b93fd2fe7c433946ade9b5d9ea') { throw 'Pinned model verification failed' }
          dotnet build tools/header-reader-probe/Probe.csproj --configuration Release --artifacts-path (Join-Path $owned 'build') --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime compilation failed' }
      - name: Measure fixed64 blind original glyph inputs without adoption
        shell: pwsh
        run: |
          $owned = Join-Path $env:RUNNER_TEMP 'isolated-header-reader-owned'
          $dll = Join-Path $owned 'build/bin/Probe/release/WindowsRasterNativeProbe.dll'
          python -B tools/ordered-row-e2e/compare_header_pairs.py --owned (Join-Path $owned 'pairs') --ink-crop --english-dll $dll --english-model (Join-Path $owned 'english-rec.onnx')
          if ($LASTEXITCODE -ne 0) { throw 'Comparison transport failed' }
          Write-Output 'Measurement completion is separate from semantic quality; qualified remains false.'
      - name: Remove owned inputs, model and build outputs
        if: always()
        shell: pwsh
        run: |
          $owned = Join-Path $env:RUNNER_TEMP 'isolated-header-reader-owned'
          if (Test-Path $owned) { Remove-Item -LiteralPath $owned -Recurse -Force }
