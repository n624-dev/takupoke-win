name: Development WebView2 checks
on:
  push:
    branches: ['codex/windows-browser-check/**']
permissions:
  contents: read
jobs:
  browser:
    name: Real loopback HTTP TLS and popup checks
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
      TAKUPOKE_OFFLINE_TEST_MODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set job-owned paths
        run: |
          $taskRoot = Join-Path $env:RUNNER_TEMP "takupoke-browser-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          @(
            "TAKUPOKE_CI_TEMP=$taskRoot"
            "TAKUPOKE_DATA_ROOT=$(Join-Path $taskRoot 'fixture')"
            "DOTNET_CLI_HOME=$(Join-Path $taskRoot 'dotnet-home')"
            "NUGET_PACKAGES=$(Join-Path $taskRoot 'nuget-packages')"
            "NUGET_HTTP_CACHE_PATH=$(Join-Path $taskRoot 'nuget-http')"
            "NUGET_PLUGINS_CACHE_PATH=$(Join-Path $taskRoot 'nuget-plugins')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.x
          cache: false
      - name: Check public files and test registration
        run: |
          python scripts/check-public-tree.py
          if ($LASTEXITCODE -ne 0) { throw 'Public tree validation failed.' }
          python -B scripts/test_catalog.py check --base HEAD^
          if ($LASTEXITCODE -ne 0) { throw 'Test registration failed.' }
      - name: Build the actual WinUI application
        run: dotnet build src/Takupoke.Win/Takupoke.Win.csproj --configuration Release -p:Platform=x64
      - name: Run real WebView2 checks only
        run: |
          $executable = (Resolve-Path 'src/Takupoke.Win/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64/takupoke.exe').Path
          dotnet run --project tests/Takupoke.Win.UITests/Takupoke.Win.UITests.csproj --configuration Release -- --browser-check $executable $env:TAKUPOKE_DATA_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Real WebView2 checks failed.' }
      - name: Remove only job-owned files
        if: always()
        run: |
          $expected = Join-Path $env:RUNNER_TEMP "takupoke-browser-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($env:TAKUPOKE_CI_TEMP -and [IO.Path]::GetFullPath($env:TAKUPOKE_CI_TEMP) -ne [IO.Path]::GetFullPath($expected)) { throw 'Unexpected cleanup path.' }
          dotnet build-server shutdown
          if ($LASTEXITCODE -ne 0) { throw 'Build server shutdown failed.' }
          if (Test-Path -LiteralPath $expected) { Remove-Item -LiteralPath $expected -Recurse -Force }
          if (Test-Path -LiteralPath $expected) { throw 'Job-owned temporary files remain.' }
