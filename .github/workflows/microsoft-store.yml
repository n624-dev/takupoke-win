name: Microsoft Store stable release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to prepare for the first Store submission
        type: string
        required: true
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: microsoft-store-stable
  cancel-in-progress: false

jobs:
  checks:
    if: >-
      github.repository == 'n624-dev/takupoke-win' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'release' && vars.MICROSOFT_STORE_AUTO_SUBMIT == 'true' && !github.event.release.prerelease &&
        startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, '-')))
    uses: ./.github/workflows/ci.yml
  store-access:
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Install Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0
      - name: Verify access without changing the Store submission
        env:
          STORE_TENANT_ID: ${{ secrets.MICROSOFT_STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.MICROSOFT_STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.MICROSOFT_STORE_CLIENT_SECRET }}
          STORE_SELLER_ID: ${{ secrets.MICROSOFT_STORE_SELLER_ID }}
        run: |
          foreach ($name in @('STORE_TENANT_ID', 'STORE_CLIENT_ID', 'STORE_CLIENT_SECRET', 'STORE_SELLER_ID')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing secret: $name" }
          }
          msstore reconfigure --tenantId $env:STORE_TENANT_ID --sellerId $env:STORE_SELLER_ID --clientId $env:STORE_CLIENT_ID --clientSecret $env:STORE_CLIENT_SECRET | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store authentication configuration failed.' }
          msstore apps get 9NC5CVVZD59H | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store application access could not be verified.' }
          Write-Output 'Store application access verified without creating, editing or submitting a submission.'
  package:
    needs: [checks, store-access]
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      bundle_sha256: ${{ steps.bundle.outputs.sha256 }}
      release_tag: ${{ steps.bundle.outputs.release_tag }}
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate stable version and isolate temporary files
        run: |
          if (-not $env:RELEASE_TAG.StartsWith('v')) { throw 'A version tag is required.' }
          $version = $env:RELEASE_TAG.Substring(1)
          ./scripts/store-version.ps1 -Version $version
          $taskRoot = Join-Path $env:RUNNER_TEMP "takupoke-store-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          @(
            "STORE_VERSION=$version"
            "TAKUPOKE_CI_TEMP=$taskRoot"
            "DOTNET_CLI_HOME=$(Join-Path $taskRoot 'dotnet-home')"
            "NUGET_PACKAGES=$(Join-Path $taskRoot 'nuget-packages')"
            "NUGET_HTTP_CACHE_PATH=$(Join-Path $taskRoot 'nuget-http')"
            "NUGET_PLUGINS_CACHE_PATH=$(Join-Path $taskRoot 'nuget-plugins')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.x
          cache: false
      - name: Check release boundaries and packaging contracts
        run: python -B tests/test_store_release.py
      - name: Build self-contained Store bundle
        run: ./scripts/build-store-package.ps1 -Version $env:STORE_VERSION -Commit $env:GITHUB_SHA
      - name: Verify Store package contents
        run: ./scripts/test-store-package.ps1 -Version $env:STORE_VERSION
      - name: Test installed MSIX and native UI
        run: ./scripts/test-store-installation.ps1 -Version $env:STORE_VERSION
      - name: Record verified bundle hash
        id: bundle
        run: |
          $bundle = Join-Path $env:TAKUPOKE_CI_TEMP "store-output/takupoke-$env:STORE_VERSION.msixbundle"
          "sha256=$((Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "release_tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
      - name: Save verified bundle to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @(Get-ChildItem -LiteralPath (Join-Path $env:TAKUPOKE_CI_TEMP 'store-output') -File | Select-Object -ExpandProperty FullName)
          if ($assets.Count -ne 2) { throw 'Unexpected Store release assets.' }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) { throw 'This version already exists; use a new version.' }
            gh release create $tag @assets --target $env:GITHUB_SHA --draft --prerelease=false --title "たくポケ $env:STORE_VERSION" --notes 'Microsoft Store向け正式版。初回のPartner Center提出用MSIXです。'
          } else {
            $source = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq .sha
            if ($LASTEXITCODE -ne 0 -or $source -cne $env:GITHUB_SHA) { throw 'The release source commit changed.' }
            gh release upload $tag @assets
          }
          if ($LASTEXITCODE -ne 0) { throw 'Saving the verified Store release failed.' }
      - name: Remove job-owned files
        if: always()
        run: |
          $expected = Join-Path $env:RUNNER_TEMP "takupoke-store-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($env:TAKUPOKE_CI_TEMP -and [IO.Path]::GetFullPath($env:TAKUPOKE_CI_TEMP) -ne [IO.Path]::GetFullPath($expected)) { throw 'Unexpected cleanup path.' }
          if (Get-Command dotnet -ErrorAction SilentlyContinue) { dotnet build-server shutdown }
          if (Test-Path -LiteralPath $expected) { Remove-Item -LiteralPath $expected -Recurse -Force }
          if (Test-Path -LiteralPath $expected) { throw 'Temporary Store files remain.' }
  submit:
    needs: package
    if: github.event_name == 'release' && vars.MICROSOFT_STORE_AUTO_SUBMIT == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
      EXPECTED_SHA256: ${{ needs.package.outputs.bundle_sha256 }}
    steps:
      - name: Download and verify the tested release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '\Av[1-9]\d*\.(0|[1-9]\d*)\.(0|[1-9]\d*)\z' -or
              $env:EXPECTED_SHA256 -cnotmatch '\A[a-f0-9]{64}\z') { throw 'Invalid verified release identity.' }
          $directory = Join-Path $env:RUNNER_TEMP "takupoke-store-submit-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $bundleName = "takupoke-$($env:RELEASE_TAG.Substring(1)).msixbundle"
          gh release download $env:RELEASE_TAG --pattern $bundleName --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'The verified release bundle could not be downloaded.' }
          $bundle = Join-Path $directory $bundleName
          if ((Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_SHA256) { throw 'The release bundle changed after validation.' }
          "STORE_BUNDLE=$bundle" >> $env:GITHUB_ENV
      - name: Install Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0
      - name: Submit stable update to Microsoft Store
        env:
          STORE_TENANT_ID: ${{ secrets.MICROSOFT_STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.MICROSOFT_STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.MICROSOFT_STORE_CLIENT_SECRET }}
          STORE_SELLER_ID: ${{ secrets.MICROSOFT_STORE_SELLER_ID }}
        run: |
          foreach ($name in @('STORE_TENANT_ID', 'STORE_CLIENT_ID', 'STORE_CLIENT_SECRET', 'STORE_SELLER_ID')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing secret: $name" }
          }
          msstore reconfigure --tenantId $env:STORE_TENANT_ID --sellerId $env:STORE_SELLER_ID --clientId $env:STORE_CLIENT_ID --clientSecret $env:STORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store authentication failed.' }
          msstore publish $env:STORE_BUNDLE --appId 9NC5CVVZD59H
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store submission failed.' }
          msstore submission status 9NC5CVVZD59H
          if ($LASTEXITCODE -ne 0) { throw 'The submitted Store status could not be retrieved.' }
