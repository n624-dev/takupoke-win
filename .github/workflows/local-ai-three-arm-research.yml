name: Fictional local AI three-arm research
on:
  workflow_dispatch:
    inputs:
      approved_packet_sha256:
        description: Exact independently reviewed portable packet SHA256
        required: true
        type: string
      approved_recipe_sha256:
        description: Exact reviewed bounded recipe SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: fictional-local-ai-three-arm-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/local-ai-three-arm-research/
            /.github/workflows/local-ai-three-arm-research.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: false
      - name: One bounded CPU-only synthetic comparison
        env:
          APPROVED_PACKET_SHA: ${{ inputs.approved_packet_sha256 }}
          APPROVED_RECIPE_SHA: ${{ inputs.approved_recipe_sha256 }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/local-ai-three-arm-research/bootstrap_ci.py --packet-sha "$APPROVED_PACKET_SHA" --recipe-sha "$APPROVED_RECIPE_SHA"
      - name: Always remove owned research scratch
        if: always()
        run: python tools/local-ai-three-arm-research/bootstrap_ci.py --cleanup-only
